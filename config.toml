name = "Big"
command = "big"
company = "brunozilio"
author = "brunozilio"

[connectors]
github_client_id = "178c6fc778ccc68e1d6a"
oauth_redirect = "http://127.0.0.1:{port}/api/connections/oauth/callback"
atlassian_mcp_url = "https://mcp.atlassian.com/v2/mcp"
aws_region = "us-east-1"

[server]
port = 7420
open_browser = true
assets_dir = ""
max_parallel_items = 4

[retry]
max = 5
initial_ms = 1000
max_interval_ms = 60000
multiplier = 2
jitter = 0.2

[timeouts]
agent_ms = 7200000
exec_ms = 1800000
call_ms = 120000

[workflow]
ask_timeout_ms = 1800000

[sync]
fast_poll_seconds = "15"
slow_poll_seconds = "180"
reconcile_minutes = "10"
error_backoff_seconds = "5"

[agent]
stream_idle_seconds = "300"

[log]
filter = "warn"

[traces]
otlp_endpoint = ""
otlp_headers = ""

[secrets]
backend = "file"

