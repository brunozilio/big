[package]
name = "llm-providers"
description = "Talking to a model: the Provider trait and the host that runs the providers written in content/providers, the model client and its wires, the transcript, credentials, OAuth, sign-in, catalogs, and the model families' prices and reasoning rules."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
test-support = []
local-models = ["dep:local-models"]

[dependencies]
brand.workspace = true
content.workspace = true
local-models = { workspace = true, optional = true }
domain.workspace = true
script.workspace = true
platform.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync"] }
tokio-util.workspace = true
base64.workspace = true
jiff.workspace = true
url.workspace = true
sha2.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
crossbeam-channel.workspace = true

[lints]
workspace = true
