[package]
name = "server"
description = "The local server: the page, the REST API and the live feed over the orchestrator, connectors and app."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
database.workspace = true
app.workspace = true
brand.workspace = true
domain.workspace = true
orchestrator.workspace = true
connectors.workspace = true
store.workspace = true
sync.workspace = true
page.workspace = true
browser.workspace = true
platform.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
axum = { workspace = true, features = ["multipart", "ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "time", "fs"] }
futures-util.workspace = true
base64.workspace = true
getrandom.workspace = true
jiff.workspace = true
async-trait = "0.1"
uuid.workspace = true
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
reqwest.workspace = true
url.workspace = true
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }

[dev-dependencies]
agent-engine = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
content.workspace = true

[lints]
workspace = true
