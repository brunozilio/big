[package]
name = "orchestrator"
description = "The workflow kernel: runs each work item's durable script by replay and executes the effects it asks for."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
domain.workspace = true
store.workspace = true
connectors.workspace = true
script.workspace = true
content.workspace = true
agent-engine.workspace = true
platform.workspace = true
brand.workspace = true
sync.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process"] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
agent-engine = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
