[package]
name = "cli"
description = "The launcher: starts the local server and opens it in the browser."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "big"
path = "src/main.rs"

[features]
local-models = ["app/local-models"]

[dependencies]
platform.workspace = true
brand.workspace = true
app.workspace = true
server.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi", "chrono", "registry", "json"] }

[build-dependencies]
brand.workspace = true

[dev-dependencies]
agent-engine = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
