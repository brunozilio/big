[package]
name = "cli"
description = "The launcher: starts the local server and opens it in the browser."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "big"
path = "src/main.rs"

[features]
default = ["subscription-providers"]
subscription-providers = ["app/subscription-providers"]

[dependencies]
platform.workspace = true
brand.workspace = true
app.workspace = true
console.workspace = true
domain.workspace = true
serde_json.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
agent-engine = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
