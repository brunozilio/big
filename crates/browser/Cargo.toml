[package]
name = "browser"
description = "The browser tools: the extension that drives the user's own Chrome, the socket it connects through and the in-process MCP server the agents call."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
brand.workspace = true
domain.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
futures-util.workspace = true
gif = "0.14"
png = "0.18"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
