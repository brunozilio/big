<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{NAME}} Browser</title><link rel="stylesheet" href="style.css"></head>
<body class="popup">
<main>
  <h1><span id="dot" class="dot"></span>{{NAME}} Browser</h1>
  <div id="state" class="muted"></div>
  <div class="row"><button id="stop" class="danger">Stop the agent</button><button id="resume" hidden>Resume</button></div>
  <section>
    <h2>This browser</h2>
    <div class="row"><input id="name" placeholder="Name shown to agents"><button id="saveName">Save</button></div>
    <div class="muted" id="device"></div>
  </section>
  <section>
    <h2>Sites</h2>
    <select id="mode">
      <option value="ask">Ask before acting on a new site</option>
      <option value="all">Act on any site without asking</option>
    </select>
    <ul id="sites"></ul>
  </section>
  <section>
    <h2>Recent actions</h2>
    <ul id="audit"></ul>
    <div class="actions"><button id="clearAudit">Clear log</button></div>
  </section>
  <section>
    <h2>Shortcuts</h2>
    <ul id="shortcuts"></ul>
    <input id="shortcutName" placeholder="Name, e.g. daily-report">
    <input id="shortcutUrl" placeholder="Start URL (optional)">
    <textarea id="shortcutPrompt" placeholder="Instructions for the agent"></textarea>
    <div class="actions"><button id="addShortcut" class="primary">Add shortcut</button></div>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
